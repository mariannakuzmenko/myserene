# Netlify deployment for this TanStack Start (SSR) app.
#
# `npm run build` runs Vite + Nitro with the Netlify preset (NITRO_PRESET below),
# which emits:
#   dist/                            -> static assets + _headers (published)
#   .netlify/functions-internal/...  -> the SSR handler, a Netlify Function v2
#                                       registered with `path = "/*"` and
#                                       `preferStatic = true`.
#
# Because the SSR function already claims every path, deep links and page
# refreshes are served by SSR and never 404. Do NOT add a catch-all redirect
# or a `public/_redirects` file here — it would shadow the SSR handler.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
